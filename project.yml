name: Tekulog
options:
  bundleIdPrefix: com.vfgnp
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_LANGUAGE: ja
    GENERATE_INFOPLIST_FILE: NO

targets:
  Tekulog:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tekulog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vfgnp.Tekulog
        INFOPLIST_FILE: Tekulog/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tekulog/Resources/Tekulog.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7N355XPFBB
        TARGETED_DEVICE_FAMILY: "1" # iPhone のみ
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Info.plist / entitlements は Resources/ の自作ファイルをそのまま使う
    # (info:/entitlements: ブロックは使わない=XcodeGen に上書きさせない)。
    # フレームワークは import で自動リンク(Core Motion / Core Location / HealthKit / MapKit)。

  TekulogTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: TekulogTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vfgnp.TekulogTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - target: Tekulog

# Xcode Cloud はリポジトリ内の共有スキームを必要とするため明示的に生成する。
schemes:
  Tekulog:
    build:
      targets:
        Tekulog: all
        TekulogTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TekulogTests
    archive:
      config: Release
